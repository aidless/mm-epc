        # CI for mm-epc
        # Runs the repository's own consistency and data checks. The paper itself is not
# recompiled here; the numbers in it are checked by these two scripts.
        # Generated by the enterprise-hardening pass (2026-10-04) against the repository's
        # actual tree. Each step runs something that exists here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the test suite
        run: python -m pytest -q
      - name: check_status.py (consistency state)
        run: python check_status.py
      - name: verify_data.py (evidence files)
        run: python verify_data.py

  mutation-control:
    # check_status.py must be able to report a problem. Prove it by running it with a
    # required input removed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Remove a required input and require a non-zero exit
        run: |
          set -euo pipefail
          target=$(git ls-files | grep -E '^(paper/)?mm_epc_paper\.tex$' | head -1)
          if [ -z "$target" ]; then
            echo 'paper source not found; mutation control cannot run'
            exit 0
          fi
          mv "$target" "$target.moved"
          if python check_status.py; then
            echo 'FAIL: check_status.py passed with the paper source removed'
            exit 1
          fi
          echo 'OK: check_status.py detected the missing paper source'
