# CI for mm-epc
#
# Scope note, verified against the tree on 2026-10-05: this repository has no
# offline unit test suite. The four test_*.py files are live-API smoke scripts that
# require API keys and read them from absolute paths on the author's machine, so
# they cannot run in CI and are excluded deliberately:
#   test_api.py / test_api2d.py / test_phase.py   need BAILIAN_KEY / DEEPSEEK / API2D keys
#   test_round.py:8 reads C:\Users\Administrator\Desktop\ai-agent-playground\.env
# Two of the repository's own gates also depend on those local paths:
#   check_status.py:6  shells out to `cmd /c tasklist` (Windows-only)
#   verify_data.py:67  reads /mnt/c/Users/Administrator/Desktop/aettl-research/experiments
# So CI verifies what is verifiable here — the evidence files parse and the tracked
# Python compiles — and says so rather than claiming coverage it does not have.
# Removing the local paths is a repository change, not a CI change, and is
# reported separately instead of being papered over here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Byte-compile every tracked Python file
        run: python -m compileall -q .

      - name: Evidence files must exist and the parseable ones must parse
        run: |
          python - <<'PY'
          import json, pathlib, sys
          missing = [d for d in ("experiments", "arxiv_submission")
                     if not pathlib.Path(d).is_dir()]
          if missing:
              sys.exit(f"missing evidence directories: {missing}")
          jsons = [j for j in pathlib.Path(".").rglob("*.json")
                   if ".git" not in j.parts]
          if not jsons:
              sys.exit("no JSON evidence files found at all")
          ok, truncated, broken = 0, [], []
          for j in jsons:
              # Some experiments/*.json were written on a Chinese-locale Windows
              # box and are not UTF-8, and a few were truncated when an experiment
              # was interrupted mid-write. Both are real conditions in this tree,
              # so record them instead of failing the whole job on them.
              raw = j.read_bytes()
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  text = raw.decode("gbk", errors="replace")
              try:
                  json.loads(text)
                  ok += 1
              except Exception as exc:
                  if '"significant"' in text and text.rstrip().endswith('"significant":'):
                      truncated.append(str(j))
                  else:
                      broken.append(f"{j}: {exc}")
          print(f"parsed {ok}/{len(jsons)} JSON evidence files")
          if truncated:
              print("::warning::truncated evidence files (interrupted writes):")
              for t in truncated:
                  print(f"  {t}")
          if broken:
              sys.exit("not JSON:\n  " + "\n  ".join(broken))
          PY

      - name: Flag remaining local machine paths (advisory)
        # The repository's own scripts still reference these. Flagging rather than
        # failing keeps the regression visible without claiming to have fixed it.
        run: |
          hits="$(grep -rInE 'C:\\Users\\|/mnt/c/Users/' \
                  --include='*.py' --include='*.md' . \
                  | grep -v '^\./\.github/workflows/' || true)"
          if [ -n "$hits" ]; then
            total="$(printf '%s\n' "$hits" | wc -l)"
            echo "::warning::$total local machine paths are still referenced"
            printf '%s\n' "$hits" | head -20
            echo "::warning::showing 20 of $total; full list in local-paths.txt"
            printf '%s\n' "$hits" > local-paths.txt
          fi
          echo "OK (advisory only)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-machine-paths
          path: local-paths.txt
          if-no-files-found: ignore

  secret-scan:
    # S5 made .gitleaks.toml + .pre-commit-config.yaml, but nothing in CI ever ran
    # them. The pre-commit hook is opt-in, absent from a fresh clone (.git/hooks
    # holds only *.sample), trivially bypassed with `git commit --no-verify`, and
    # only inspects staged content -- never history. Verified on 2026-10-05 by
    # committing a key matching the `openai-style-key` rule: every job stayed green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a key leaked in an old commit is still a live key.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_NOTIFY_USER_LIST: ""

  mutation-control:
    # Proves the syntax gate can fail. Without this a green job only proves that
    # compileall ran, not that it would catch anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Introduce a syntax error and require a non-zero exit
        shell: bash
        run: |
          set -euo pipefail
          cp check_status.py /tmp/check_status.py.bak
          printf '\ndef broken(:\n    pass\n' >> check_status.py
          if python -m compileall -q check_status.py >/dev/null 2>&1; then
            echo 'FAIL: compileall accepted a file with a syntax error'
            exit 1
          fi
          echo 'OK: the gate rejected the injected syntax error'